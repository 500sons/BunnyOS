name: Build BunnyOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y live-build isolinux xorriso debootstrap

      - name: Build ISO
        run: |
          mkdir -p build && cd build
          sudo lb config \
            --distribution bookworm \
            --architecture amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloader syslinux
          
          mkdir -p config/package-lists
          cat << 'EOF' | sudo tee config/package-lists/bunnyos.list.chroot
          xfce4
          xfce4-terminal
          thunar
          firefox-esr
          chromium
          vlc
          wireguard
          openvpn
          network-manager-gnome
          flameshot
          steam-installer
          EOF

          sudo lb build
          mv live-image-amd64.hybrid.iso BunnyOS.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunnyOS-ISO
          path: build/BunnyOS.iso
